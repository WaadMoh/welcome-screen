<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECAE Welcome Experience</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hidden camera -->
    <video
        id="camera"
        autoplay
        playsinline
        muted
        width="300"
        style="
            position:fixed;
            bottom:20px;
            right:20px;
            border:3px solid white;
            border-radius:12px;
            z-index:9999;
        ">
    </video>
    <!-- Normal screen -->
    <div id="idleScreen">

        <div class="content">
            <h1>ECAE Student Support Portal</h1>

            <p>
                Welcome to Emirates College for Advanced Education
            </p>

            <div class="info-box" id="status">
                Waiting for visitor...
            </div>
        </div>

    </div>

    <!-- Welcome overlay -->
    <div id="welcomeOverlay">

        <div class="welcome-card">
            <h1>Welcome to ECAE</h1>

            <p>
                How can we support you today?
            </p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
